# ─────────────────────────────────────────────────────────────────────────────
# fluent-bit.conf
#
# Supports HDFS, Thunderbird, and Zookeeper datasets.
# To switch datasets:
#   1. Update Path to point at your log file
#   2. Update Parser to match: hdfs | thunderbird | zookeeper
#   3. Run consumer.py with --dataset hdfs | thunderbird | zookeeper
# ─────────────────────────────────────────────────────────────────────────────

[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info
    Parsers_File /Users/memoortega/Documents/College/Spring 2026/EC528/ingestion/parsers.conf

[INPUT]
    Name             tail
    Path             /Users/memoortega/Documents/College/Spring 2026/EC528/ingestion/data/HDFS_2k.log
    Parser           hdfs
    Tag              logs.raw
    Read_from_Head   On
    Refresh_Interval 2

[OUTPUT]
    Name             http
    Match            logs.raw
    Host             127.0.0.1
    Port             9880
    URI              /ingest
    Format           json_lines
    json_date_key    timestamp
    json_date_format iso8601
    Header           Content-Type application/x-ndjson
    Retry_Limit      3