[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    debug

[INPUT]
    Name             tail
    Path             ../data/HDFS.log
    Parser           hdfs
    Tag              hdfs.raw
    Read_from_Head   On
    Refresh_Interval 2

[OUTPUT]
    Name        http
    Match       hdfs.raw
    Host        127.0.0.1
    Port        9880
    URI         /ingest
    Format      json_lines
    Header      Content-Type application/x-ndjson
    Retry_Limit 3